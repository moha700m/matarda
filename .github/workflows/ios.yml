name: ios

on:
  push:
  workflow_dispatch:

concurrency:
  group: matarda-${{ github.ref }}
  cancel-in-progress: true

jobs:
  multiplayer-test:
    name: headless multiplayer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Import assets and register scripts
        run: godot --headless --path . --import --quit

      - name: Run dedicated-server multiplayer test
        run: bash tools/mp_test.sh

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiplayer-test-logs
          path: docs/test_results/
          if-no-files-found: ignore

  ios-ipa:
    name: unsigned iOS ipa
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Download Godot 4.7.2 and export templates
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/godot-macos.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip"
          unzip -q /tmp/godot-macos.zip -d /tmp/godot-macos
          chmod +x "/tmp/godot-macos/Godot.app/Contents/MacOS/Godot"
          xattr -dr com.apple.quarantine "/tmp/godot-macos/Godot.app" || true
          RAW="$("/tmp/godot-macos/Godot.app/Contents/MacOS/Godot" --version | awk '{print $1}')"
          BASE="$(echo "$RAW" | awk -F. '{print $1"."$2"."$3"."$4}')"
          echo "Godot version raw=$RAW templates=$BASE"
          curl -fsSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          for dest in "$BASE" "$RAW"; do
            TARGET="$HOME/Library/Application Support/Godot/export_templates/$dest"
            mkdir -p "$TARGET"
            cp -R /tmp/godot-templates/templates/. "$TARGET/"
          done

      - name: Export Xcode project
        run: |
          set -euo pipefail
          mkdir -p build/ios
          "/tmp/godot-macos/Godot.app/Contents/MacOS/Godot" --headless --path . --export-release "iOS" "build/ios/matarda"
          test -d build/ios/matarda.xcodeproj
          test -d build/ios/matarda

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project build/ios/matarda.xcodeproj \
            -scheme matarda \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/ios/derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEPLOYMENT_POSTPROCESSING=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            DEAD_CODE_STRIPPING=YES \
            COPY_PHASE_STRIP=YES \
            STRIP_STYLE=non-global \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            build
          APP="$(find build/ios/derived/Build/Products -type d -name '*.app' | head -n 1)"
          echo "APP=$APP"
          test -n "$APP"
          BIN="$APP/$(basename "$APP" .app)"
          test -f "$BIN"
          echo "binary before strip:"
          ls -lh "$BIN"
          strip -x -S "$BIN"
          echo "binary after strip -x -S:"
          ls -lh "$BIN"
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -type f -name '*.dylib' -exec strip -x {} \;
            if [ -f "$APP/Frameworks/libswift_Concurrency.dylib" ] && ! otool -L "$BIN" | grep -q 'libswift_Concurrency'; then
              rm -f "$APP/Frameworks/libswift_Concurrency.dylib"
              echo "removed unreferenced libswift_Concurrency.dylib"
            fi
          fi
          echo "app contents:"
          du -ah "$APP" | sort -h
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          BIN_IN_PAYLOAD="build/ipa/Payload/$(basename "$APP")/$(basename "$APP" .app)"
          test -f "$BIN_IN_PAYLOAD"
          strip -x "$BIN_IN_PAYLOAD"
          (cd build/ipa && zip -9 -X -y -r ../matarda.ipa Payload)
          ls -lh build/matarda.ipa
          unzip -l build/matarda.ipa | head
          BYTES=$(stat -f%z build/matarda.ipa)
          echo "ipa_bytes=$BYTES"
          BYTES="$BYTES" python3 -c 'import os,sys; n=int(os.environ["BYTES"]); print("ipa_mb=%.2f" % (n/1_000_000)); sys.exit(0 if n < 24_000_000 else 1)'

      - name: Upload matarda.ipa
        uses: actions/upload-artifact@v4
        with:
          name: matarda-ipa
          path: build/matarda.ipa
          if-no-files-found: error
